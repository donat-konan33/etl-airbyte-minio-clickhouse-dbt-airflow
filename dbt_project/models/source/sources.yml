# dbt_project/models/source/sources.yml
# how to define clickhouse as source in dbt

version: 2

sources:
  - name: clickhouse
    schema: datawarehouse
    description: "Raw data from the location and weather tables"
    tables:

      - name: raw_depcode_
        identifier: raw_depcode_
        description: department with their, an unique code per department
        columns:
          - name: geo_point_2d
            description: Geographical Point, currently in bytes
          - name: geo_shape
            description: Geographical Shape, currently in bytes
          - name: reg_name
            description: name of region of the department
          - name: reg_code
            description: code of region
          - name: dep_name_upper
            description: department name set to upper
          - name: dep_current_code
            description: code of department
            tests:
              - unique
              - not_null
          - name: dep_status
            description: the status rural or urbain of the department
            data_tests:
              - accepted_values:
                  values:
                    - rural
                    - urbain
          - name : department
            description: Name of department that is the same use to call data via visual crossing api (can help joining table)
            tests:
              - not_null
          - name : dep_normalized
            description : Name of department normalized


      - name: latest_weather_
        identifier: raw_weather_
        description: >
          Table getting with Python data extraction solution (Python Solution)
          Table containing the latest available weather observations and daily aggregates
          for French departments, including temperature, precipitation, wind, solar radiation
          and atmospheric metrics.

        columns:

          - name: id
            description: >
              Unique identifier representing a single extraction batch for a given set
              of departments (UUID generated during ingestion).

          - name: resolvedAddress
            description: >
              Fully resolved location name returned by the API, usually including
              the department name and its region.

          - name: address
            description: >
              Raw address or location string used in the API request.

          - name: latitude
            description: Latitude of the weather observation location.

          - name: longitude
            description: Longitude of the weather observation location.

          - name: datetime
            description: >
              Date or datetime of the weather observation, currently stored as a string.

          - name: datetimeEpoch
            description: >
              Unix timestamp (number of seconds since 1970-01-01) corresponding
              to the observation date.

          - name: tempmax
            description: Maximum temperature recorded for the day (°C).

          - name: tempmin
            description: Minimum temperature recorded for the day (°C).

          - name: temp
            description: Mean temperature for the day (°C).

          - name: feelslikemax
            description: Maximum perceived temperature for the day (°C).

          - name: feelslikemin
            description: Minimum perceived temperature for the day (°C).

          - name: feelslike
            description: Average perceived temperature for the day (°C).

          - name: dew
            description: >
              Dew point temperature (°C), indicating the temperature at which air
              becomes saturated with moisture.

          - name: humidity
            description: Relative humidity of the air (%).

          - name: precip
            description: Total precipitation recorded for the day (mm).

          - name: precipprob
            description: Probability of precipitation (%).

          - name: precipcover
            description: Percentage of the day during which precipitation occurred (%).

          - name: preciptype
            description: >
              Type of precipitation recorded (e.g. rain, snow, hail).

          - name: snow
            description: Snowfall amount recorded for the day (cm).

          - name: snowdepth
            description: Average snow depth on the ground for the day (cm).

          - name: windgust
            description: >
              Maximum wind gust speed recorded over a short time period (kph).

          - name: windspeed
            description: Average wind speed (kph).

          - name: winddir
            description: >
              Wind direction expressed in degrees from north
              (0° = North, 90° = East, 180° = South, 270° = West).

          - name: pressure
            description: >
              Atmospheric pressure adjusted to sea level, expressed in millibars (mb).

          - name: cloudcover
            description: Percentage of cloud cover (%).

          - name: visibility
            description: Visibility distance in daylight conditions (km).

          - name: solarradiation
            description: >
              Instantaneous solar radiation power measured at the observation time (W/m²).

          - name: solarenergy
            description: >
              Total solar energy accumulated over the day.

          - name: uvindex
            description: >
              Ultraviolet (UV) exposure index ranging from 0 to 10.

          - name: severerisk
            description: >
              Risk score between 0 and 100 indicating the likelihood of severe
              convective weather events (e.g. thunderstorms, hail).

          - name: sunrise
            description: Sunrise time for the observation location.

          - name: sunriseEpoch
            description: Unix timestamp corresponding to sunrise time.

          - name: sunset
            description: Sunset time for the observation location.

          - name: sunsetEpoch
            description: Unix timestamp corresponding to sunset time.

          - name: moonphase
            description: Moon phase expressed as a fraction between 0 and 1.

          - name: conditions
            description: >
              High-level weather condition label (e.g. sunny, cloudy, rainy).

          - name: description
            description: Detailed textual description of the weather conditions.

          - name: icon
            description: Icon code representing the weather conditions.

          - name: stations
            description: >
              Weather stations used to generate the observations.

          - name: source
            description: Data source identifier.

          - name: department
            description: Name of the French department associated with the weather data.


      - name: latest_weather
        identifier: raw_weather
        description: table gathering all the most weather metrics recorded (AIRBYTE solution)
        columns:
          - name: _airbyte_ab_id
            description: "airbyte record id representing a slot of departments recorded (0198e6ee-13ae-7d92-8691-288930209531)"
          - name: latitude
            description: "For location"
          - name: longitude
            description: "For location"
          - name: resolvedAddress
            description: "the department name comes with region mentioned"
          - name: cloudcover
            description: "Percentage of cloud cover (%)."
          - name: conditions
            description: "General weather conditions (e.g., sunny, cloudy, rainy)."
          - name: datetime
            description: "Date and time of the measurement in string format currently."
          - name: datetimeEpoch
            description: "Number of seconds from 1970-01-01 to the target date"
          - name: description
            description: "Detailed description of weather conditions."
          - name: dew
            description: "Dew point in °C (temperature at which air becomes saturated with humidity)."
          - name: feelslike
            description: "Average perceived temperature for the day (in °C)."
          - name: feelslikemax
            description: "Maximum perceived temperature for the day (in °C)."
          - name: feelslikemin
            description: "Minimum perceived temperature for the day (in °C)."
          - name: humidity
            description: "Relative humidity of the air in percentage (%)."
          - name: icon
            description: "Icon representing weather conditions."
          - name: moonphase
            description: "Moon phase (%)."
          - name: precip
            description: "Total amount of precipitation recorded (in mm)."
          - name: precipcover
            description: "Percentage of the time period covered by precipitation (%)."
          - name: precipprob
            description: "Probability of precipitation in percentage (%)."
          - name: preciptype
            description: "Type of recorded precipitation (e.g., rain, snow, hail)."
          - name: pressure
            description: The atmospheric pressure at a location that removes reduction in pressure due to the altitude of the location. This is expressed in millibars (mb).
          - name: severerisk
            description: "Severe risk is value between 0 and 100 representing the risk of convective storms (e.g. thunderstorms, hail and tornadoes). "
          - name: snow
            description: "Thickness of the snow in cm"
          - name: snowdepth
            description: "Snow depth is the average amount of snow currently on the ground for the time period (cm)"
          - name: solarenergy
            description: "Indicates the total energy from the sun that builds up over an hour or day"
          - name: solarradiation
            description: "Measures the power (in W/m2) at the instantaneous moment of the observation"
          - name: source
            description: "source"
          - name: stations
            description: "stations where measurements were recorded"
          - name: sunrise
            description: "Sunrise time"
          - name: sunriseEpoch
            description: "Unix date"
          - name: sunset
            description: "Sunset time"
          - name: sunsetEpoch
            description: "Unix date"
          - name: temp
            description: "Mean temperature in °C"
          - name: tempmax
            description: "Maximal temperature  in °C"
          - name: tempmin
            description: "Minimal temperature  in °C"
          - name: uvindex
            description: "A value between 0 and 10 indicating the level of ultra violet (UV) exposure for that hour or day"
          - name: visibility
            description:  "Visibility is the distance that can be seen in daylight (in km)"
          - name: winddir
            description: "indicates the direction from where the wind is blowing from. The units of the wind direction is degrees from north. The value ranges from 0 degrees (from the North), to 90 degrees (from the east), 180 degrees (from the south), 270 (from the west) back to 360 degrees"
          - name: windgust
            description: "Wind gust is the maximum wind speed (kph) measures over a short amount of time (typically less than 20 seconds)"
          - name: windspeed
            description: "Speed of wind (kph)"
          - name: department
            description: "The name of target department"
            tests:
              - not_null
          - name: datetime
            description: "Date and time of the measurement in string format currently."
            tests:
              - not_null
